<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voraphon</title>
  <meta name="description" content="หน้าแนะนำตัวของ Voraphon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f2;
      --card: #ffffff;
      --text: #1c1c1a;
      --muted: #6b6a64;
      --line: #e4e2da;
      --accent: #2f6f5e;
      --accent-soft: #e3efe9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151614;
        --card: #1e1f1c;
        --text: #ecebe6;
        --muted: #a09f98;
        --line: #2e2f2b;
        --accent: #7cc4ad;
        --accent-soft: #23332d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Thai", "Segoe UI", Tahoma, sans-serif;
      line-height: 1.7;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 16px 48px;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(32px, 7vw, 44px);
      line-height: 1.2;
      margin: 0 0 8px;
    }
    .role {
      color: var(--accent);
      font-weight: 500;
      margin: 0 0 20px;
    }
    .intro {
      color: var(--muted);
      font-size: 18px;
      margin: 0 0 28px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 56px;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      background: var(--card);
      font-size: 15px;
      transition: border-color .15s, color .15s;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .links svg { width: 16px; height: 16px; fill: currentColor; }
    h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 16px;
    }
    .projects { display: grid; gap: 12px; margin-bottom: 56px; }
    .project {
      display: block;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    .project:hover { border-color: var(--accent); transform: translateY(-2px); }
    .project h3 { margin: 0 0 4px; font-size: 18px; }
    .project p { margin: 0; color: var(--muted); font-size: 15px; }
    .project .url { color: var(--accent); font-size: 14px; margin-top: 8px; }
    footer {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">V</div>

    <h1>สวัสดี เราชื่อเก่ง</h1>
    <p class="role">[อาชีพ / ตำแหน่ง]</p>
    <p class="intro">
      [แนะนำตัวสั้นๆ 1–2 ประโยค เช่น ทำงานด้านอะไร สนใจอะไร]
      ตอนนี้กำลังหัดสร้างเว็บแอปของตัวเอง
    </p>

        GitHub

      <a href="mailto:[อีเมล]">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3h13A1.5 1.5 0 0116 4.5v7a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 010 11.5v-7A1.5 1.5 0 011.5 3zm.3 1.5L8 8.6l6.2-4.1H1.8zM14.5 6L8.4 10a.75.75 0 01-.8 0L1.5 6v5.5h13V6z"/></svg>

    <h2>ผลงาน</h2>

      <a class="project" href="https://todo.voraphon.com" target="_blank" rel="noopener">
        <h3>To-do App</h3>
        <p>แอปจดงานที่ต้องทำ ล็อกอินแยกข้อมูลแต่ละคน แนบรูปได้</p>

    <footer>© 2026 Voraphon</footer>
  </main>
</body>
</html>
