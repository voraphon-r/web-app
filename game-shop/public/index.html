<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game-Shop · รายรับรายจ่ายร้านเกม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6fb;
      --panel: #ffffff;
      --line: #e4e6ef;
      --text: #1d2233;
      --muted: #6b7280;
      --brand: #6d28d9;
      --brand-soft: #ede9fe;
      --in: #15803d;
      --in-soft: #e8f5ec;
      --out: #dc2626;
      --out-soft: #fdecec;
      --shadow: 0 4px 16px rgba(29, 34, 51, 0.06);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { font-family: "Sarabun", "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0 0 48px; font-size: 16px; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
    h1, h2, .prompt { font-family: "Prompt", "Sarabun", sans-serif; }
    input, select, button, textarea { font-family: inherit; font-size: 16px; color: inherit; }
    button { border: none; cursor: pointer; background: none; }
    button:disabled { opacity: 0.5; cursor: default; }

    header { display: flex; align-items: center; gap: 12px; padding: 20px 0 14px; }
    .logo { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(145deg, #8b5cf6, #5b21b6); display: grid; place-items: center; font-size: 26px; flex: none; box-shadow: 0 6px 14px rgba(109,40,217,0.3); }
    header h1 { margin: 0; font-size: 22px; white-space: nowrap; line-height: 1.15; }
    header small { color: var(--muted); font-size: 13px; }
    .head-text { flex: 1; min-width: 0; }
    .live { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #9ca3af; font-weight: 600; }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .live.on { color: var(--in); }
    .link { color: var(--brand); font-weight: 600; font-size: 14px; padding: 6px 4px; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .panel h2 { margin: 0 0 10px; font-size: 17px; }
    label.f { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
    .in { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .in:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; min-width: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; font-family: "Prompt", sans-serif; font-weight: 600; }
    .btn.primary { background: var(--brand); color: #fff; width: 100%; margin-top: 14px; }
    .btn.ghost { background: #f1f2f6; color: var(--text); }
    .btn.danger { background: var(--out-soft); color: var(--out); }
    .msg { font-size: 14px; margin-top: 8px; min-height: 1em; }
    .msg.err { color: var(--out); }

    /* เดือน + สรุป */
    .month-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .month-bar .btn { padding: 8px 12px; }
    .month-bar input { flex: 1; text-align: center; font-family: "Prompt", sans-serif; font-weight: 600; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { border-radius: 14px; padding: 10px 12px; }
    .card small { display: block; font-size: 13px; font-weight: 600; opacity: 0.85; }
    .card b { display: block; font-family: "Prompt", sans-serif; font-size: 20px; line-height: 1.3; word-break: break-all; }
    .card.in { background: var(--in-soft); color: var(--in); }
    .card.out { background: var(--out-soft); color: var(--out); }
    .card.net { grid-column: 1 / -1; background: var(--brand-soft); color: var(--brand); }
    .card.net b { font-size: 26px; }

    /* ฟอร์ม */
    .seg { display: grid; grid-template-columns: 1fr 1fr; background: #f1f2f6; border-radius: 12px; padding: 4px; gap: 4px; }
    .seg button { padding: 10px; border-radius: 9px; font-family: "Prompt", sans-serif; font-weight: 600; color: var(--muted); }
    .seg button.on[data-kind="income"] { background: var(--in); color: #fff; }
    .seg button.on[data-kind="expense"] { background: var(--out); color: #fff; }
    .amount { font-size: 26px; font-family: "Prompt", sans-serif; font-weight: 600; text-align: right; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { padding: 7px 12px; border-radius: 999px; background: #f1f2f6; font-size: 14px; }
    .chips button.on { background: var(--brand); color: #fff; }
    .edit-tag { display: inline-block; background: #fef3c7; color: #92400e; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
    .form-actions { display: flex; gap: 8px; margin-top: 10px; }
    .form-actions .btn { flex: 1; }

    /* รายการ */
    .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .list-head h2 { margin: 0; }
    .filter { display: flex; gap: 4px; }
    .filter button { padding: 5px 10px; border-radius: 999px; font-size: 13px; background: #f1f2f6; }
    .filter button.on { background: var(--text); color: #fff; }
    .day { margin-top: 12px; }
    .day-h { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 2px 4px; border-bottom: 1px solid var(--line); }
    .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 2px; border-bottom: 1px dashed var(--line); }
    .item:hover { background: #fafafe; }
    .dot { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 18px; }
    .dot.income { background: var(--in-soft); color: var(--in); }
    .dot.expense { background: var(--out-soft); color: var(--out); }
    .item-text { flex: 1; min-width: 0; line-height: 1.3; }
    .item-text b { display: block; font-weight: 600; }
    .item-text small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-amt { font-family: "Prompt", sans-serif; font-weight: 600; white-space: nowrap; }
    .item-amt.income { color: var(--in); }
    .item-amt.expense { color: var(--out); }
    .empty { text-align: center; color: var(--muted); padding: 20px 0 8px; }

    /* แยกหมวด */
    .bars { display: grid; gap: 8px; }
    .bar-row { font-size: 14px; }
    .bar-label { display: flex; justify-content: space-between; gap: 8px; }
    .bar-track { height: 8px; background: #f1f2f6; border-radius: 99px; overflow: hidden; margin-top: 3px; }
    .bar-fill { height: 100%; border-radius: 99px; }
    .bar-fill.income { background: var(--in); }
    .bar-fill.expense { background: var(--out); }
    .sub-h { font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
    .sub-h:first-child { margin-top: 0; }
    .foot { display: flex; justify-content: center; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🎮</div>
      <div class="head-text">
        <h1>บัญชีร้านเกม</h1>
        <small id="who">กรุณาเข้าสู่ระบบ</small> <span class="live" id="live" hidden>สด</span>
      </div>
      <button class="link" id="logoutBtn" hidden>ออกจากระบบ</button>
    </header>

    <!-- เข้าสู่ระบบ -->
    <section class="panel" id="loginView" hidden>
      <h2>เข้าสู่ระบบ</h2>
      <form id="loginForm">
        <label class="f" for="email">อีเมล</label>
        <input class="in" id="email" type="email" autocomplete="username" required>
        <label class="f" for="password">รหัสผ่าน</label>
        <input class="in" id="password" type="password" autocomplete="current-password" required>
        <button class="btn primary" type="submit" id="loginBtn">เข้าสู่ระบบ</button>
        <div class="msg err" id="loginMsg"></div>
      </form>
    </section>

    <!-- ไม่มีสิทธิ์ -->
    <section class="panel" id="noAccessView" hidden>
      <h2>บัญชีนี้ยังไม่ได้รับสิทธิ์</h2>
      <p>ให้เจ้าของร้านเพิ่มอีเมลของคุณในรายชื่อสมาชิกก่อน แล้วลองเข้าใหม่อีกครั้ง</p>
    </section>

    <div id="appView" hidden>
      <!-- สรุปเดือน -->
      <section class="panel">
        <div class="month-bar">
          <button class="btn ghost" id="prevMonth" aria-label="เดือนก่อน">‹</button>
          <input class="in" type="month" id="month">
          <button class="btn ghost" id="nextMonth" aria-label="เดือนถัดไป">›</button>
        </div>
        <div class="cards">
          <div class="card in"><small>รายรับ</small><b id="sumIn">0</b></div>
          <div class="card out"><small>รายจ่าย</small><b id="sumOut">0</b></div>
          <div class="card net"><small>คงเหลือ (รายรับ − รายจ่าย)</small><b id="sumNet">0</b></div>
        </div>
      </section>

      <!-- เพิ่ม/แก้รายการ -->
      <section class="panel">
        <h2 id="formTitle">บันทึกรายการ</h2>
        <form id="entryForm">
          <div class="seg" id="kindSeg">
            <button type="button" data-kind="income">+ รายรับ</button>
            <button type="button" data-kind="expense">− รายจ่าย</button>
          </div>
          <label class="f" for="amount">จำนวนเงิน (บาท)</label>
          <input class="in amount" id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" required>
          <div class="row">
            <div>
              <label class="f" for="category">หมวดหมู่</label>
              <select class="in" id="category" required></select>
            </div>
            <div>
              <label class="f" for="entryDate">วันที่</label>
              <input class="in" id="entryDate" type="date" required>
            </div>
          </div>
          <label class="f">ช่องทาง</label>
          <div class="chips" id="methodChips"></div>
          <label class="f" for="note">หมายเหตุ (ไม่บังคับ)</label>
          <input class="in" id="note" type="text" maxlength="200" placeholder="เช่น ซื้อน้ำอัดลม 2 ลัง">
          <div class="form-actions">
            <button class="btn primary" type="submit" id="saveBtn" style="margin-top:0">บันทึก</button>
          </div>
          <div class="form-actions" id="editActions" hidden>
            <button class="btn ghost" type="button" id="cancelEdit">ยกเลิกการแก้</button>
            <button class="btn danger" type="button" id="deleteBtn">ลบรายการนี้</button>
          </div>
          <div class="msg" id="formMsg"></div>
        </form>
      </section>

      <!-- รายการของเดือน -->
      <section class="panel">
        <div class="list-head">
          <h2>รายการเดือนนี้</h2>
          <div class="filter" id="filter">
            <button data-f="all" class="on">ทั้งหมด</button>
            <button data-f="income">รับ</button>
            <button data-f="expense">จ่าย</button>
          </div>
        </div>
        <div id="list"></div>
      </section>

      <!-- แยกตามหมวด -->
      <section class="panel">
        <h2>แยกตามหมวดหมู่</h2>
        <div id="breakdown"></div>
      </section>

      <div class="foot"><button class="btn ghost" id="csvBtn">ดาวน์โหลดเดือนนี้ (CSV)</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // ===== ตั้งค่า Supabase (โปรเจกต์ voraphon-apps ใช้ร่วมกับแอปอื่น) =====
    const SUPABASE_URL = 'https://qfxqjpqpytkaymlyjuuz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7A3d5nMlhvAu6vLB2VvG3A_uyKserby';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'game_shop' } });

    const METHODS = ['เงินสด', 'โอน', 'บัตร', 'อื่นๆ'];
    const KIND_TH = { income: 'รายรับ', expense: 'รายจ่าย' };
    const $ = (id) => document.getElementById(id);

    const state = {
      user: null,
      categories: [],
      entries: [],
      month: '',
      filter: 'all',
      kind: 'income',
      method: 'เงินสด',
      editingId: null,
      channel: null,
    };

    // ===== ตัวช่วย =====
    function todayBkk() {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
    }
    function money(n) {
      return Number(n).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function monthRange(ym) {
      const [y, m] = ym.split('-').map(Number);
      const next = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`;
      return { from: `${ym}-01`, to: `${next}-01` };
    }
    function shiftMonth(ym, d) {
      let [y, m] = ym.split('-').map(Number);
      m += d;
      if (m < 1) { m = 12; y--; }
      if (m > 12) { m = 1; y++; }
      return `${y}-${String(m).padStart(2, '0')}`;
    }
    function thaiDate(iso) {
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: '2-digit' });
    }
    function setMsg(el, text, isErr) {
      el.textContent = text;
      el.classList.toggle('err', !!isErr);
    }

    // ===== หน้าจอ =====
    function show(view) {
      $('loginView').hidden = view !== 'login';
      $('noAccessView').hidden = view !== 'noaccess';
      $('appView').hidden = view !== 'app';
      $('logoutBtn').hidden = view === 'login';
    }

    async function onSession(session) {
      state.user = session?.user ?? null;
      if (!state.user) {
        stopRealtime();
        $('who').textContent = 'กรุณาเข้าสู่ระบบ';
        $('live').hidden = true;
        show('login');
        return;
      }
      const email = state.user.email.toLowerCase();
      const { data, error } = await db.from('members').select('display_name').eq('email', email).maybeSingle();
      if (error || !data) {
        $('who').textContent = email;
        show('noaccess');
        return;
      }
      $('who').textContent = `สวัสดี ${data.display_name}`;
      show('app');
      await loadCategories();
      await loadEntries();
      startRealtime();
    }

    // ===== ข้อมูล =====
    async function loadCategories() {
      const { data, error } = await db.from('categories').select('kind,name,sort_order').eq('active', true).order('sort_order');
      if (error) { setMsg($('formMsg'), 'โหลดหมวดหมู่ไม่ได้: ' + error.message, true); return; }
      state.categories = data;
      renderCategoryOptions();
    }

    async function loadEntries() {
      const { from, to } = monthRange(state.month);
      const { data, error } = await db.from('entries')
        .select('*')
        .gte('entry_date', from).lt('entry_date', to)
        .order('entry_date', { ascending: false })
        .order('created_at', { ascending: false });
      if (error) { $('list').innerHTML = `<div class="empty">โหลดรายการไม่ได้: ${esc(error.message)}</div>`; return; }
      state.entries = data;
      renderAll();
    }

    function startRealtime() {
      stopRealtime();
      state.channel = db.channel('game-shop-entries')
        .on('postgres_changes', { event: '*', schema: 'game_shop', table: 'entries' }, () => loadEntries())
        .subscribe((status) => { $('live').hidden = false; $('live').classList.toggle('on', status === 'SUBSCRIBED'); });
    }
    function stopRealtime() {
      if (state.channel) { db.removeChannel(state.channel); state.channel = null; }
    }

    // ===== วาดหน้าจอ =====
    function renderCategoryOptions(selected) {
      const opts = state.categories.filter((c) => c.kind === state.kind);
      const sel = $('category');
      const keep = selected ?? sel.value;
      sel.innerHTML = opts.map((c) => `<option>${esc(c.name)}</option>`).join('');
      // รายการเก่าที่หมวดถูกซ่อนไปแล้ว ยังแก้ได้
      if (keep && !opts.some((c) => c.name === keep) && selected) sel.insertAdjacentHTML('beforeend', `<option>${esc(keep)}</option>`);
      if (keep && [...sel.options].some((o) => o.value === keep)) sel.value = keep;
    }

    function renderKind() {
      document.querySelectorAll('#kindSeg button').forEach((b) => b.classList.toggle('on', b.dataset.kind === state.kind));
    }
    function renderMethods() {
      $('methodChips').innerHTML = METHODS.map((m) => `<button type="button" data-m="${m}" class="${m === state.method ? 'on' : ''}">${m}</button>`).join('');
    }

    function renderAll() {
      let sumIn = 0, sumOut = 0;
      for (const e of state.entries) {
        if (e.kind === 'income') sumIn += Number(e.amount); else sumOut += Number(e.amount);
      }
      $('sumIn').textContent = money(sumIn);
      $('sumOut').textContent = money(sumOut);
      $('sumNet').textContent = (sumIn - sumOut < 0 ? '−' : '') + money(Math.abs(sumIn - sumOut));
      renderList();
      renderBreakdown();
    }

    function renderList() {
      const rows = state.entries.filter((e) => state.filter === 'all' || e.kind === state.filter);
      if (!rows.length) { $('list').innerHTML = '<div class="empty">ยังไม่มีรายการในเดือนนี้</div>'; return; }
      const byDay = new Map();
      for (const e of rows) {
        if (!byDay.has(e.entry_date)) byDay.set(e.entry_date, []);
        byDay.get(e.entry_date).push(e);
      }
      let html = '';
      for (const [day, items] of byDay) {
        const net = items.reduce((s, e) => s + (e.kind === 'income' ? 1 : -1) * Number(e.amount), 0);
        html += `<div class="day"><div class="day-h"><span>${thaiDate(day)}</span><span>${net < 0 ? '−' : '+'}${money(Math.abs(net))}</span></div>`;
        for (const e of items) {
          const sign = e.kind === 'income' ? '+' : '−';
          const meta = [e.payment_method, e.note, e.created_by?.split('@')[0]].filter(Boolean).map(esc).join(' · ');
          html += `<button class="item" data-id="${e.id}">
            <span class="dot ${e.kind}">${sign}</span>
            <span class="item-text"><b>${esc(e.category)}</b><small>${meta}</small></span>
            <span class="item-amt ${e.kind}">${sign}${money(e.amount)}</span>
          </button>`;
        }
        html += '</div>';
      }
      $('list').innerHTML = html;
    }

    function renderBreakdown() {
      let html = '';
      for (const kind of ['income', 'expense']) {
        const totals = new Map();
        for (const e of state.entries) if (e.kind === kind) totals.set(e.category, (totals.get(e.category) || 0) + Number(e.amount));
        if (!totals.size) continue;
        const sorted = [...totals].sort((a, b) => b[1] - a[1]);
        const max = sorted[0][1];
        html += `<div class="sub-h">${KIND_TH[kind]}</div><div class="bars">`;
        for (const [name, amt] of sorted) {
          html += `<div class="bar-row"><div class="bar-label"><span>${esc(name)}</span><b>${money(amt)}</b></div>
            <div class="bar-track"><div class="bar-fill ${kind}" style="width:${Math.max(2, (amt / max) * 100)}%"></div></div></div>`;
        }
        html += '</div>';
      }
      $('breakdown').innerHTML = html || '<div class="empty">ยังไม่มีข้อมูล</div>';
    }

    // ===== ฟอร์ม =====
    function resetForm() {
      state.editingId = null;
      $('formTitle').innerHTML = 'บันทึกรายการ';
      $('editActions').hidden = true;
      $('saveBtn').textContent = 'บันทึก';
      $('amount').value = '';
      $('note').value = '';
      // วันที่: ถ้าดูเดือนปัจจุบันใช้วันนี้ ถ้าดูเดือนอื่นใช้วันที่ 1 ของเดือนนั้น
      const today = todayBkk();
      $('entryDate').value = today.startsWith(state.month) ? today : `${state.month}-01`;
    }

    function startEdit(id) {
      const e = state.entries.find((x) => x.id === id);
      if (!e) return;
      state.editingId = id;
      state.kind = e.kind;
      state.method = e.payment_method;
      renderKind();
      renderMethods();
      renderCategoryOptions(e.category);
      $('amount').value = Number(e.amount);
      $('entryDate').value = e.entry_date;
      $('note').value = e.note ?? '';
      $('formTitle').innerHTML = 'แก้ไขรายการ<span class="edit-tag">กำลังแก้</span>';
      $('saveBtn').textContent = 'บันทึกการแก้ไข';
      $('editActions').hidden = false;
      setMsg($('formMsg'), '');
      $('entryForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function saveEntry(ev) {
      ev.preventDefault();
      const amount = Number(String($('amount').value).replace(/[,\s]/g, ''));
      if (!(amount > 0)) { setMsg($('formMsg'), 'ใส่จำนวนเงินมากกว่า 0', true); $('amount').focus(); return; }
      const row = {
        kind: state.kind,
        category: $('category').value,
        amount: Math.round(amount * 100) / 100,
        entry_date: $('entryDate').value,
        payment_method: state.method,
        note: $('note').value.trim() || null,
      };
      if (!row.category) { setMsg($('formMsg'), 'เลือกหมวดหมู่ก่อน', true); return; }
      $('saveBtn').disabled = true;
      const { error } = state.editingId
        ? await db.from('entries').update(row).eq('id', state.editingId)
        : await db.from('entries').insert(row);
      $('saveBtn').disabled = false;
      if (error) { setMsg($('formMsg'), 'บันทึกไม่สำเร็จ: ' + error.message, true); return; }
      setMsg($('formMsg'), `${state.editingId ? 'แก้ไขแล้ว' : 'บันทึกแล้ว'}: ${KIND_TH[row.kind]} ${row.category} ${money(row.amount)} บาท`);
      const savedMonth = row.entry_date.slice(0, 7);
      resetForm();
      if (savedMonth !== state.month) { state.month = savedMonth; $('month').value = savedMonth; }
      await loadEntries();
      $('amount').focus();
    }

    async function deleteEntry() {
      const e = state.entries.find((x) => x.id === state.editingId);
      if (!e || !confirm(`ลบ ${KIND_TH[e.kind]} "${e.category}" ${money(e.amount)} บาท ใช่ไหม?`)) return;
      const { error } = await db.from('entries').delete().eq('id', e.id);
      if (error) { setMsg($('formMsg'), 'ลบไม่สำเร็จ: ' + error.message, true); return; }
      setMsg($('formMsg'), 'ลบรายการแล้ว');
      resetForm();
      await loadEntries();
    }

    function downloadCsv() {
      const head = ['วันที่', 'ประเภท', 'หมวดหมู่', 'จำนวนเงิน', 'ช่องทาง', 'หมายเหตุ', 'ผู้บันทึก'];
      const lines = [...state.entries].reverse().map((e) =>
        [e.entry_date, KIND_TH[e.kind], e.category, e.amount, e.payment_method, e.note ?? '', e.created_by]
          .map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','));
      // BOM ให้ Excel อ่านภาษาไทยถูก
      const blob = new Blob(['﻿' + [head.join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `game-shop-${state.month}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // ===== ผูกปุ่ม =====
    $('loginForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      $('loginBtn').disabled = true;
      setMsg($('loginMsg'), '');
      const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
      $('loginBtn').disabled = false;
      if (error) setMsg($('loginMsg'), 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', true);
    });
    $('logoutBtn').addEventListener('click', () => db.auth.signOut());

    $('kindSeg').addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      state.kind = b.dataset.kind;
      renderKind();
      renderCategoryOptions();
    });
    $('methodChips').addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      state.method = b.dataset.m;
      renderMethods();
    });
    $('entryForm').addEventListener('submit', saveEntry);
    $('cancelEdit').addEventListener('click', () => { resetForm(); setMsg($('formMsg'), ''); });
    $('deleteBtn').addEventListener('click', deleteEntry);
    $('list').addEventListener('click', (ev) => {
      const b = ev.target.closest('.item');
      if (b) startEdit(b.dataset.id);
    });
    $('filter').addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      state.filter = b.dataset.f;
      document.querySelectorAll('#filter button').forEach((x) => x.classList.toggle('on', x === b));
      renderList();
    });
    function changeMonth(ym) {
      if (!ym) return;
      state.month = ym;
      $('month').value = ym;
      if (!state.editingId) resetForm();
      loadEntries();
    }
    $('month').addEventListener('change', () => changeMonth($('month').value));
    $('prevMonth').addEventListener('click', () => changeMonth(shiftMonth(state.month, -1)));
    $('nextMonth').addEventListener('click', () => changeMonth(shiftMonth(state.month, 1)));
    $('csvBtn').addEventListener('click', downloadCsv);

    // ===== เริ่ม =====
    state.month = todayBkk().slice(0, 7);
    $('month').value = state.month;
    renderKind();
    renderMethods();
    resetForm();
    db.auth.onAuthStateChange((event, session) => {
      if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(event)) setTimeout(() => onSession(session), 0);
    });
  </script>
</body>
</html>
