<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game-Shop · บันทึกประจำกะ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6fb;
      --panel: #ffffff;
      --line: #e4e6ef;
      --text: #1d2233;
      --muted: #6b7280;
      --brand: #6d28d9;
      --brand-soft: #ede9fe;
      --cash: #15803d;
      --cash-soft: #e8f5ec;
      --tf: #1d4ed8;
      --tf-soft: #e6eefe;
      --red: #dc2626;
      --red-soft: #fdecec;
      --shadow: 0 4px 16px rgba(29, 34, 51, 0.06);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { font-family: "Sarabun", "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0 0 48px; font-size: 16px; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
    h1, h2, .prompt { font-family: "Prompt", "Sarabun", sans-serif; }
    input, select, button { font-family: inherit; font-size: 16px; color: inherit; }
    button { border: none; cursor: pointer; background: none; }
    button:disabled { opacity: 0.5; cursor: default; }

    header { display: flex; align-items: center; gap: 12px; padding: 20px 0 14px; }
    .logo { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(145deg, #8b5cf6, #5b21b6); display: grid; place-items: center; font-size: 26px; flex: none; box-shadow: 0 6px 14px rgba(109,40,217,0.3); }
    header h1 { margin: 0; font-size: 22px; line-height: 1.15; white-space: nowrap; }
    header small { color: var(--muted); font-size: 13px; }
    .head-text { flex: 1; min-width: 0; }
    .live { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #9ca3af; font-weight: 600; }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .live.on { color: var(--cash); }
    .link { color: var(--brand); font-weight: 600; font-size: 14px; padding: 6px 4px; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .panel h2 { margin: 0 0 10px; font-size: 17px; }
    label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
    .in { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .in:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; font-family: "Prompt", sans-serif; font-weight: 600; }
    .btn.primary { background: var(--brand); color: #fff; width: 100%; margin-top: 14px; font-size: 18px; }
    .btn.ghost { background: #f1f2f6; color: var(--text); }
    .btn.danger { background: var(--red-soft); color: var(--red); }
    .msg { font-size: 14px; margin-top: 8px; min-height: 1em; }
    .msg.err { color: var(--red); }

    /* แถบกะ */
    .shift-bar { display: flex; align-items: center; gap: 10px; }
    .shift-bar .t { flex: 1; min-width: 0; line-height: 1.3; }
    .shift-bar b { font-family: "Prompt", sans-serif; font-size: 18px; display: block; }
    .shift-bar small { color: var(--muted); font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .card { border-radius: 14px; padding: 8px 10px; background: #f1f2f6; }
    .card small { display: block; font-size: 12px; font-weight: 600; opacity: 0.85; }
    .card b { display: block; font-family: "Prompt", sans-serif; font-size: 20px; line-height: 1.3; }
    .card.cash { background: var(--cash-soft); color: var(--cash); }
    .card.tf { background: var(--tf-soft); color: var(--tf); }

    /* ฟอร์ม */
    .machines { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .machines button { padding: 10px 0; border-radius: 10px; background: #f1f2f6; font-family: "Prompt", sans-serif; font-weight: 600; font-size: 17px; }
    .machines button.on { background: var(--brand); color: #fff; }
    .money-row { display: flex; gap: 6px; align-items: center; }
    .money-row .in { flex: 1; min-width: 0; font-family: "Prompt", sans-serif; font-weight: 600; font-size: 20px; text-align: right; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chips button { padding: 6px 12px; border-radius: 999px; background: #f1f2f6; font-size: 14px; font-weight: 600; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; background: #f1f2f6; border-radius: 12px; padding: 4px; gap: 4px; }
    .seg button { padding: 11px; border-radius: 9px; font-family: "Prompt", sans-serif; font-weight: 600; color: var(--muted); font-size: 17px; }
    .seg button.on[data-pay="cash"] { background: var(--cash); color: #fff; }
    .seg button.on[data-pay="transfer"] { background: var(--tf); color: #fff; }
    .total-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .total-line b { font-family: "Prompt", sans-serif; font-size: 26px; }
    .change { font-family: "Prompt", sans-serif; font-weight: 600; color: var(--cash); margin-top: 6px; }
    .change.short { color: var(--red); }
    .edit-tag { display: inline-block; background: #fef3c7; color: #92400e; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
    .form-actions { display: flex; gap: 8px; margin-top: 10px; }
    .form-actions .btn { flex: 1; }

    /* ตารางแบบสมุด */
    table.book { width: 100%; border-collapse: collapse; font-size: 15px; }
    table.book th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; padding: 4px 3px; border-bottom: 2px solid var(--line); white-space: nowrap; }
    table.book td { text-align: right; padding: 8px 3px; border-bottom: 1px dashed var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
    table.book th:first-child, table.book td:first-child { text-align: left; }
    table.book th.c, table.book td.c { text-align: center; }
    table.book tbody tr { cursor: pointer; }
    table.book tbody tr:hover { background: #fafafe; }
    table.book tbody tr.editing { background: #fef9e7; }
    table.book td.tf { color: var(--tf); font-weight: 600; }
    table.book td.cash { color: var(--cash); font-weight: 600; }
    table.book td small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
    table.book tfoot td { font-weight: 700; border-bottom: none; border-top: 2px solid var(--line); font-family: "Prompt", sans-serif; }
    .mno { display: inline-block; min-width: 26px; padding: 1px 6px; border-radius: 7px; background: var(--brand-soft); color: var(--brand); font-weight: 700; text-align: center; }
    .empty { text-align: center; color: var(--muted); padding: 18px 0 6px; }

    /* กะที่ผ่านมา */
    .past { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 2px; border-bottom: 1px dashed var(--line); }
    .past .t { flex: 1; min-width: 0; line-height: 1.3; }
    .past b { display: block; font-weight: 600; }
    .past small { color: var(--muted); font-size: 13px; }
    .past .amt { text-align: right; font-size: 13px; line-height: 1.4; white-space: nowrap; }
    .past .amt .c { color: var(--cash); font-weight: 600; }
    .past .amt .tf { color: var(--tf); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🎮</div>
      <div class="head-text">
        <h1>บันทึกประจำกะ</h1>
        <small id="who">กรุณาเข้าสู่ระบบ</small> <span class="live" id="live" hidden>สด</span>
      </div>
      <button class="link" id="logoutBtn" hidden>ออกจากระบบ</button>
    </header>

    <!-- เข้าสู่ระบบ -->
    <section class="panel" id="loginView" hidden>
      <h2>เข้าสู่ระบบ</h2>
      <form id="loginForm">
        <label class="f" for="email">อีเมล</label>
        <input class="in" id="email" type="email" autocomplete="username" required>
        <label class="f" for="password">รหัสผ่าน</label>
        <input class="in" id="password" type="password" autocomplete="current-password" required>
        <button class="btn primary" type="submit" id="loginBtn">เข้าสู่ระบบ</button>
        <div class="msg err" id="loginMsg"></div>
      </form>
    </section>

    <!-- ไม่มีสิทธิ์ -->
    <section class="panel" id="noAccessView" hidden>
      <h2>บัญชีนี้ยังไม่ได้รับสิทธิ์</h2>
      <p>ให้เจ้าของร้านเพิ่มอีเมลของคุณในรายชื่อสมาชิกก่อน แล้วลองเข้าใหม่อีกครั้ง</p>
    </section>

    <div class="msg err" id="dataMsg" role="alert"></div>
    <button class="link" id="retryBtn" hidden>ลองโหลดอีกครั้ง</button>
    <div id="appView" hidden>
      <!-- ยังไม่มีกะเปิด -->
      <section class="panel" id="openView" hidden>
        <h2>เปิดกะใหม่</h2>
        <form id="openForm">
          <label class="f" for="staffName">ชื่อคนเข้ากะ</label>
          <input class="in" id="staffName" type="text" maxlength="40" placeholder="เช่น ต้น" required>
          <button class="btn primary" type="submit" id="openBtn">เปิดกะ</button>
          <div class="msg" id="openMsg"></div>
        </form>
      </section>

      <!-- กะ (กะที่เปิดอยู่ หรือกะเก่าที่กดดู) -->
      <div id="shiftView" hidden>
        <section class="panel">
          <div class="shift-bar">
            <div class="t"><b id="shiftTitle"></b><small id="shiftSub"></small></div>
            <button class="btn danger" id="closeShiftBtn">ปิดกะ</button>
            <button class="btn ghost" id="backBtn">กลับ</button>
          </div>
          <div class="cards">
            <div class="card"><small>รายการ</small><b id="sumCount">0</b></div>
            <div class="card cash"><small>เงินสด</small><b id="sumCash">0</b></div>
            <div class="card tf"><small>โอน</small><b id="sumTf">0</b></div>
          </div>
        </section>

        <!-- บันทึกรายการ -->
        <section class="panel" id="entryPanel">
          <h2 id="formTitle">บันทึกลูกค้า</h2>
          <form id="entryForm">
            <label class="f">เครื่องที่เล่น</label>
            <div class="machines" id="machines"></div>

            <label class="f" for="game">ค่าเกม</label>
            <div class="money-row"><input class="in" id="game" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
            <div class="chips" data-target="game"><button type="button">15</button><button type="button">30</button><button type="button">60</button><button type="button">100</button></div>

            <label class="f" for="drink">ค่าน้ำ / ขนม</label>
            <div class="money-row"><input class="in" id="drink" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
            <div class="chips" data-target="drink"><button type="button">10</button><button type="button">14</button><button type="button">15</button><button type="button">20</button></div>

            <label class="f">จ่ายแบบ</label>
            <div class="seg" id="paySeg">
              <button type="button" data-pay="cash">เงินสด</button>
              <button type="button" data-pay="transfer">โอน</button>
            </div>

            <div id="cashBox">
              <label class="f" for="received">รับเงินมา (ไม่บังคับ ไว้คิดเงินทอน)</label>
              <div class="money-row"><input class="in" id="received" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></div>
              <div class="chips" data-target="received"><button type="button">20</button><button type="button">50</button><button type="button">100</button><button type="button">500</button><button type="button">1000</button></div>
              <div class="change" id="changeLine"></div>
            </div>

            <div class="total-line"><span>รวม</span><b id="totalLine">0</b></div>
            <button class="btn primary" type="submit" id="saveBtn">บันทึก</button>
            <div class="form-actions" id="editActions" hidden>
              <button class="btn ghost" type="button" id="cancelEdit">ยกเลิกการแก้</button>
              <button class="btn danger" type="button" id="deleteBtn">ลบรายการนี้</button>
            </div>
            <div class="msg" id="formMsg"></div>
          </form>
        </section>

        <!-- ตารางแบบสมุด -->
        <section class="panel">
          <h2>รายการในกะนี้</h2>
          <div id="book"></div>
        </section>
      </div>

      <!-- กะที่ผ่านมา -->
      <section class="panel" id="pastView" hidden>
        <h2>กะที่ผ่านมา</h2>
        <div id="pastList"></div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // ===== ตั้งค่า =====
    const SUPABASE_URL = 'https://qfxqjpqpytkaymlyjuuz.supabase.co';   // โปรเจกต์ voraphon-apps แยกตารางด้วย schema game_shop
    const SUPABASE_KEY = 'sb_publishable_7A3d5nMlhvAu6vLB2VvG3A_uyKserby';
    const MACHINE_COUNT = 20;   // จำนวนเครื่องในร้าน
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'game_shop' } });

    const $ = (id) => document.getElementById(id);
    const state = {
      user: null,
      openShift: null,      // กะที่เปิดอยู่ (ถ้ามี)
      viewShift: null,      // กะที่กำลังดู (กะที่เปิดอยู่ หรือกะเก่า)
      entries: [],
      machine: null,
      pay: 'cash',
      editingId: null,
      channel: null,
      busy: false, ready: false, pending: null, refreshVersion: 0,
    };

    // ===== ตัวช่วย =====
    const num = (v) => {
      const text = String(v ?? '').trim();
      if (!text) return 0;
      if (!/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(text)) return NaN;
      const n = Number(text.replaceAll(',', ''));
      return Number.isFinite(n) && n <= 99999999.99 ? n : NaN;
    };
    const money = (n) => Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hhmm = (ts) => new Date(ts).toLocaleTimeString('th-TH', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' });
    const dateTh = (ts) => new Date(ts).toLocaleDateString('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric', month: 'short', year: '2-digit' });
    const entryTotal = (e) => (Math.round(Number(e.game_amount) * 100) + Math.round(Number(e.drink_amount) * 100)) / 100;
    function setMsg(el, text, isErr) { el.textContent = text; el.classList.toggle('err', !!isErr); }
    function sums(entries) {
      let cash = 0, tf = 0, game = 0, drink = 0;
      for (const e of entries) {
        game += Math.round(Number(e.game_amount) * 100); drink += Math.round(Number(e.drink_amount) * 100);
        if (e.pay_method === 'cash') cash += Math.round(entryTotal(e) * 100); else tf += Math.round(entryTotal(e) * 100);
      }
      return { count: entries.length, cash: cash / 100, tf: tf / 100, game: game / 100, drink: drink / 100 };
    }
    const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

    // ===== หน้าจอ =====
    function show(view) {
      $('loginView').hidden = view !== 'login';
      $('noAccessView').hidden = view !== 'noaccess';
      $('appView').hidden = view !== 'app';
      $('logoutBtn').hidden = view === 'login';
    }

    async function onSession(session) {
      const sessionVersion = ++state.refreshVersion;
      const sessionUserId = session?.user?.id;
      stopRealtime();
      state.ready = false;
      state.pending = null;
      state.user = session?.user ?? null;
      state.openShift = state.viewShift = null; state.entries = []; state.past = [];
      resetForm();
      $('dataMsg').textContent = ''; $('retryBtn').hidden = true;
      show('login');
      if (!state.user) {
        stopRealtime();
        $('who').textContent = 'กรุณาเข้าสู่ระบบ';
        $('live').hidden = true;
        show('login');
        return;
      }
      const email = state.user.email.toLowerCase();
      let data, error;
      try { ({ data, error } = await db.from('members').select('display_name').eq('email', email).maybeSingle()); }
      catch (failure) { error = failure; }
      if (sessionVersion !== state.refreshVersion) return;
      if (error) { setMsg($('dataMsg'), 'ตรวจสิทธิ์ไม่ได้: ' + error.message, true); $('retryBtn').hidden = false; return; }
      if (!data) { $('who').textContent = email; show('noaccess'); return; }
      $('who').textContent = data.display_name;
      show('app');
      try { state.pending = JSON.parse(lsGet('gs-pending-' + state.user.id) || 'null'); } catch { state.pending = null; }
      await refresh();
      if (state.pending) {
        const pending = state.pending;
        state.machine = pending.row.machine; state.pay = pending.row.pay_method;
        state.editingId = pending.editing ? pending.id : null;
        $('game').value = pending.row.game_amount; $('drink').value = pending.row.drink_amount;
        $('received').value = pending.row.cash_received ?? '';
        renderMachines(); renderPay(); render();
        setMsg($('dataMsg'), 'มีรายการที่ยังไม่ได้ยืนยันผล กดบันทึกเพื่อตรวจและส่งรายการเดิมอีกครั้ง', true);
      }
      if (state.user?.id === sessionUserId) startRealtime();
    }

    // ===== ข้อมูล =====
    async function allRows(query) {
      const rows = [];
      for (let offset = 0; ; offset += 500) {
        const { data, error } = await query().range(offset, offset + 499);
        if (error) throw error;
        rows.push(...data);
        if (data.length < 500) return rows;
      }
    }
    async function refresh() {
      const version = ++state.refreshVersion;
      state.ready = false;
      render();
      try {
        const { data: open, error } = await db.from('shifts').select('*').is('closed_at', null).maybeSingle();
        if (error) throw error;
        const old = state.viewShift;
        let view = state.pending ? { id: state.pending.shift } : (old?.closed_at ? old : open);
        if (view) {
          const result = await db.from('shifts').select('*').eq('id', view.id).single();
          if (result.error) throw result.error;
          view = result.data;
        }
        const entries = view ? await allRows(() => db.from('shift_entries').select('*').eq('shift_id', view.id).order('created_at').order('id')) : [];
        const pastResult = await db.from('shifts').select('*').not('closed_at', 'is', null).order('opened_at', { ascending: false }).limit(10);
        if (pastResult.error) throw pastResult.error;
        const past = [];
        for (const shift of pastResult.data) {
          const rows = await allRows(() => db.from('shift_entries').select('*').eq('shift_id', shift.id).order('created_at').order('id'));
          past.push({ ...shift, sums: sums(rows) });
        }
        if (version !== state.refreshVersion || !state.user) return false;
        if (!state.pending && (old?.id !== view?.id || view?.closed_at)) resetForm();
        state.openShift = open; state.viewShift = view; state.entries = entries; state.past = past;
        state.ready = true;
        setMsg($('dataMsg'), ''); $('retryBtn').hidden = true;
        render();
        return true;
      } catch (error) {
        if (version !== state.refreshVersion) return false;
        state.ready = false;
        setMsg($('dataMsg'), 'โหลดข้อมูลไม่ครบ กรุณาลองใหม่ก่อนบันทึกหรือปิดกะ: ' + error.message, true);
        $('retryBtn').hidden = false;
        render();
        return false;
      }
    }

    function startRealtime() {
      stopRealtime();
      const later = () => { clearTimeout(state.realtimeTimer); state.realtimeTimer = setTimeout(refresh, 150); };
      state.channel = db.channel('game-shop')
        .on('postgres_changes', { event: '*', schema: 'game_shop', table: 'shifts' }, later)
        .on('postgres_changes', { event: '*', schema: 'game_shop', table: 'shift_entries' }, later)
        .subscribe((status) => { if (status === 'SUBSCRIBED') later(); $('live').textContent = status === 'SUBSCRIBED' ? 'สด' : 'ขาดการเชื่อมต่อ'; $('live').hidden = false; $('live').classList.toggle('on', status === 'SUBSCRIBED'); });
    }
    function stopRealtime() { clearTimeout(state.realtimeTimer); if (state.channel) { db.removeChannel(state.channel); state.channel = null; } }

    // ===== วาดหน้าจอ =====
    function render() {
      $('logoutBtn').disabled = state.busy;
      for (const id of ['saveBtn', 'openBtn', 'closeShiftBtn', 'deleteBtn']) $(id).disabled = state.busy || !state.ready;
      document.querySelectorAll('#entryForm input, #entryForm button').forEach(el => { el.disabled = state.busy || !!state.pending; });
      $('saveBtn').disabled = state.busy || !state.ready;
      const v = state.viewShift;
      const isOpen = !!v && !v.closed_at;
      $('openView').hidden = !!state.openShift || (v && v.closed_at);
      $('shiftView').hidden = !v;
      $('pastView').hidden = !!(v && v.closed_at);
      if (!$('staffName').value) $('staffName').value = lsGet('gs-staff') || '';
      if (v) {
        $('shiftTitle').textContent = `กะของ ${v.staff_name}`;
        $('shiftSub').textContent = `${dateTh(v.opened_at)} · ${hhmm(v.opened_at)}–${v.closed_at ? hhmm(v.closed_at) : 'ตอนนี้'}`;
        $('closeShiftBtn').hidden = !isOpen;
        $('backBtn').hidden = isOpen;
        $('entryPanel').hidden = !isOpen && !state.pending;
        const s = sums(state.entries);
        $('sumCount').textContent = s.count;
        $('sumCash').textContent = money(s.cash);
        $('sumTf').textContent = money(s.tf);
        renderBook(s);
      }
      renderPast();
    }

    function renderBook(s) {
      if (!state.entries.length) { $('book').innerHTML = '<div class="empty">ยังไม่มีรายการ</div>'; return; }
      let rows = '';
      for (const e of state.entries) {
        const t = entryTotal(e);
        const change = e.pay_method === 'cash' && e.cash_received > t ? `<small>รับ ${money(e.cash_received)} ทอน ${money(e.cash_received - t)}</small>` : '';
        rows += `<tr data-id="${e.id}" class="${e.id === state.editingId ? 'editing' : ''}">
          <td>${hhmm(e.created_at)}</td>
          <td class="c"><span class="mno">${e.machine}</span></td>
          <td>${e.game_amount > 0 ? money(e.game_amount) : '–'}</td>
          <td>${e.drink_amount > 0 ? money(e.drink_amount) : '–'}</td>
          <td class="tf">${e.pay_method === 'transfer' ? money(t) : '–'}</td>
          <td class="cash">${e.pay_method === 'cash' ? money(t) : '–'}${change}</td>
        </tr>`;
      }
      $('book').innerHTML = `<table class="book">
        <thead><tr><th>เวลา</th><th class="c">เครื่อง</th><th>ค่าเกม</th><th>ค่าน้ำ</th><th>โอน</th><th>สด</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>${s.count} รายการ</td><td></td><td>${money(s.game)}</td><td>${money(s.drink)}</td><td class="tf">${money(s.tf)}</td><td class="cash">${money(s.cash)}</td></tr></tfoot>
      </table>`;
    }

    function renderPast() {
      const list = state.past || [];
      $('pastList').innerHTML = list.length ? list.map((p) => `
        <button class="past" data-id="${p.id}">
          <span class="t"><b>${dateTh(p.opened_at)} · ${esc(p.staff_name)}</b><small>${hhmm(p.opened_at)}–${hhmm(p.closed_at)} · ${p.sums.count} รายการ</small></span>
          <span class="amt"><span class="c">สด ${money(p.sums.cash)}</span><br><span class="tf">โอน ${money(p.sums.tf)}</span></span>
        </button>`).join('') : '<div class="empty">ยังไม่มีกะที่ปิดแล้ว</div>';
    }

    function renderMachines() {
      let html = '';
      for (let i = 1; i <= MACHINE_COUNT; i++) html += `<button type="button" data-m="${i}" class="${state.machine === i ? 'on' : ''}">${i}</button>`;
      $('machines').innerHTML = html;
    }
    function renderPay() {
      document.querySelectorAll('#paySeg button').forEach((b) => b.classList.toggle('on', b.dataset.pay === state.pay));
      $('cashBox').hidden = state.pay !== 'cash';
      renderTotal();
    }
    function renderTotal() {
      const t = (Math.round(num($('game').value) * 100) + Math.round(num($('drink').value) * 100)) / 100;
      $('totalLine').textContent = money(t);
      const r = num($('received').value);
      const line = $('changeLine');
      if (state.pay === 'cash' && r > 0 && t > 0) {
        line.textContent = r >= t ? `ทอน ${money(r - t)} บาท` : `เงินขาดอีก ${money(t - r)} บาท`;
        line.classList.toggle('short', r < t);
      } else line.textContent = '';
    }

    // ===== ฟอร์ม =====
    function resetForm() {
      state.editingId = null;
      state.machine = null;
      state.pay = 'cash';
      $('game').value = ''; $('drink').value = ''; $('received').value = '';
      $('formTitle').textContent = 'บันทึกลูกค้า';
      $('saveBtn').textContent = 'บันทึก';
      $('editActions').hidden = true;
      renderMachines(); renderPay();
    }

    function startEdit(id) {
      const e = state.entries.find((x) => x.id === id);
      if (!e || !state.ready || state.busy || state.pending || state.viewShift?.closed_at) return;
      state.editingId = id;
      state.machine = e.machine;
      state.pay = e.pay_method;
      $('game').value = e.game_amount > 0 ? Number(e.game_amount) : '';
      $('drink').value = e.drink_amount > 0 ? Number(e.drink_amount) : '';
      $('received').value = e.cash_received ? Number(e.cash_received) : '';
      $('formTitle').innerHTML = `แก้รายการ ${hhmm(e.created_at)}<span class="edit-tag">กำลังแก้</span>`;
      $('saveBtn').textContent = 'บันทึกการแก้ไข';
      $('editActions').hidden = false;
      setMsg($('formMsg'), '');
      renderMachines(); renderPay(); render();
      $('entryPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function saveEntry(ev) {
      ev.preventDefault();
      if (state.busy || !state.ready || (!state.pending && (!state.viewShift || state.viewShift.closed_at))) return;
      const game = num($('game').value), drink = num($('drink').value);
      const received = state.pay === 'cash' && $('received').value.trim() ? num($('received').value) : null;
      if (![game, drink, received ?? 0].every(Number.isFinite)) { setMsg($('formMsg'), 'ใส่จำนวนเงินเป็นตัวเลขไม่ติดลบ และทศนิยมไม่เกิน 2 ตำแหน่ง', true); return; }
      if (!state.machine || state.machine < 1 || state.machine > MACHINE_COUNT) { setMsg($('formMsg'), 'เลือกเครื่องก่อน', true); return; }
      if (game + drink <= 0) { setMsg($('formMsg'), 'ใส่ค่าเกมหรือค่าน้ำอย่างน้อย 1 ช่อง', true); return; }
      if (received !== null && Math.round(received * 100) < Math.round((game + drink) * 100)) { setMsg($('formMsg'), 'เงินที่รับมาน้อยกว่ายอดรวม', true); return; }
      const row = { machine: state.machine, game_amount: game, drink_amount: drink, pay_method: state.pay, cash_received: received };
      // Keep the exact same UUID and payload after an uncertain network response.
      const pending = state.pending || { row, id: state.editingId || crypto.randomUUID(), editing: !!state.editingId, shift: state.viewShift.id };
      state.pending = pending;
      lsSet('gs-pending-' + state.user.id, JSON.stringify(pending));
      await mutate(async () => {
        if (pending.editing) {
          const { data, error } = await db.from('shift_entries').update(pending.row).eq('id', pending.id).eq('shift_id', pending.shift).select('id').single();
          if (error) throw error;
          if (!data) throw new Error('ไม่พบรายการที่แก้ไข');
        } else {
          const { error } = await db.from('shift_entries').insert({ ...pending.row, id: pending.id, shift_id: pending.shift });
          if (error) {
            const existing = await db.from('shift_entries').select('*').eq('id', pending.id).single();
            if (existing.error && existing.error.code !== 'PGRST116') throw new Error('ยังตรวจสอบผลรายการเดิมไม่ได้ กรุณาลองอีกครั้ง');
            if (!existing.data || existing.data.shift_id !== pending.shift || Object.keys(pending.row).some(k => existing.data[k] !== pending.row[k])) throw error;
          }
        }
        state.pending = null;
        lsSet('gs-pending-' + state.user.id, 'null');
        resetForm(); setMsg($('formMsg'), 'บันทึกแล้ว');
      });
    }

    async function mutate(action) {
      if (state.busy) return;
      state.busy = true; render();
      try { await action(); await refresh(); }
      catch (error) { if (state.pending && error.code !== '23505' && /^(22|23|42|P0001|PGRST)/.test(error.code || '')) {
        state.pending = null; lsSet('gs-pending-' + state.user.id, 'null');
      } setMsg($('dataMsg'), 'ทำรายการไม่สำเร็จ: ' + error.message + (state.pending ? ' · กดบันทึกเพื่อลองส่งรายการเดิมอีกครั้ง' : ''), true); }
      finally { state.busy = false; render(); }
    }
    async function deleteEntry() {
      if (state.busy || !state.ready || state.pending || state.viewShift?.closed_at) return;
      const e = state.entries.find(x => x.id === state.editingId);
      if (!e || !confirm('ลบรายการนี้ใช่ไหม?')) return;
      await mutate(async () => {
        const { error } = await db.from('shift_entries').delete().eq('id', e.id).select('id').single();
        if (error) throw error;
        resetForm(); setMsg($('formMsg'), 'ลบรายการแล้ว');
      });
    }
    async function openShift(ev) {
      ev.preventDefault();
      if (state.busy || !state.ready || state.openShift) return;
      const name = $('staffName').value.trim();
      if (!name || name.length > 40) return;
      await mutate(async () => {
        const { error } = await db.from('shifts').insert({ staff_name: name });
        if (error) { await refresh(); throw error; }
        lsSet('gs-staff', name); state.viewShift = null; resetForm();
      });
    }
    async function closeShift() {
      if (state.busy || !state.ready || state.pending || !state.viewShift || state.viewShift.closed_at) return;
      const id = state.viewShift.id;
      await mutate(async () => {
        if (!await refresh() || state.viewShift?.id !== id || state.viewShift.closed_at) throw new Error('กะเปลี่ยนแล้ว กรุณาตรวจข้อมูลใหม่');
        const s = sums(state.entries);
        if (!confirm('ปิดกะของ ' + state.viewShift.staff_name + '?\n' + s.count + ' รายการ · สด ' + money(s.cash) + ' · โอน ' + money(s.tf) + '\nยอดสดนี้ไม่รวมเงินทอนตั้งต้นหรือรายจ่าย')) return;
        const { error } = await db.rpc('close_shift', { p_id: id, p_count: s.count, p_cash: s.cash, p_transfer: s.tf });
        if (error) throw error;
        state.viewShift = null; resetForm();
      });
    }

    // ===== ผูกปุ่ม =====
    $('loginForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      $('loginBtn').disabled = true;
      setMsg($('loginMsg'), '');
      const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
      $('loginBtn').disabled = false;
      if (error) setMsg($('loginMsg'), 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', true);
    });
    $('retryBtn').addEventListener('click', () => onSession(state.user ? { user: state.user } : null));
    $('logoutBtn').addEventListener('click', () => db.auth.signOut());
    $('openForm').addEventListener('submit', openShift);
    $('closeShiftBtn').addEventListener('click', closeShift);
    $('backBtn').addEventListener('click', () => { if (state.busy || state.pending) return; state.viewShift = null; resetForm(); refresh(); });
    $('machines').addEventListener('click', (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      state.machine = Number(b.dataset.m); renderMachines();
    });
    $('paySeg').addEventListener('click', (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      state.pay = b.dataset.pay; renderPay();
    });
    document.querySelectorAll('.chips').forEach((c) => c.addEventListener('click', (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      $(c.dataset.target).value = b.textContent; renderTotal();
    }));
    ['game', 'drink', 'received'].forEach((id) => $(id).addEventListener('input', renderTotal));
    $('entryForm').addEventListener('submit', saveEntry);
    $('cancelEdit').addEventListener('click', () => { if (state.busy || state.pending) return; resetForm(); setMsg($('formMsg'), ''); render(); });
    $('deleteBtn').addEventListener('click', deleteEntry);
    $('book').addEventListener('click', (ev) => {
      const tr = ev.target.closest('tbody tr'); if (tr) startEdit(tr.dataset.id);
    });
    $('pastList').addEventListener('click', (ev) => {
      const b = ev.target.closest('.past'); if (!b || state.busy || state.pending) return;
      state.viewShift = (state.past || []).find((p) => p.id === b.dataset.id);
      resetForm();
      refresh().then(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
    });

    // ===== เริ่ม =====
    resetForm();
    db.auth.onAuthStateChange((event, session) => {
      if (['INITIAL_SESSION', 'SIGNED_IN', 'SIGNED_OUT'].includes(event)) setTimeout(() => onSession(session), 0);
    });
  </script>
</body>
</html>
